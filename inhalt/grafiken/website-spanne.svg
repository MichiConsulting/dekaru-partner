<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#141414">
  <title id="t">Von der günstigsten zur teuersten Website: drei Voreinstellungen des Preisrechners</title>
  <desc id="d">Drei Säulen. Klein 500 Euro: nur die Grundleistung. Mittel 1.500 Euro: Grundleistung plus vier Unterseiten, Galerie, Karte, Leistungsliste, Referenzen, Suchmaschinen-Grundlagen und zwei Texte. Groß 1.800 Euro: wie Mittel, dazu eine fünfte Unterseite, Team-Sektion und Bildaufbereitung.</desc>
  <style>
    .h { font-family: "Space Grotesk", Inter, system-ui, sans-serif; font-weight: 700; }
    .m { fill: #5C5C5C; }
    .box { fill: #EEEEEB; stroke: #C9C9C5; }
    .base { fill: #141414; }
    .acc { fill: #7B1E2B; }
    .w { fill: #FFFFFF; }
  </style>

  <!-- Säule Klein -->
  <g transform="translate(40 40)">
    <text class="h" font-size="18" y="0">Klein</text>
    <text class="h acc" font-size="22" y="28">500 €</text>
    <text class="m" y="48">Größenordnung S</text>
    <rect class="base" x="0" y="290" width="200" height="50" rx="3"/>
    <text class="w" x="12" y="320" font-weight="600">Grundleistung 500 €</text>
    <text class="m" x="0" y="365">Startseite, Handy und Rechner,</text>
    <text class="m" x="0" y="382">Impressum, Datenschutz, Kontakt-</text>
    <text class="m" x="0" y="399">formular, verschlüsselt (HTTPS)</text>
  </g>

  <!-- Säule Mittel -->
  <g transform="translate(300 40)">
    <text class="h" font-size="18" y="0">Mittel</text>
    <text class="h acc" font-size="22" y="28">1.500 €</text>
    <text class="m" y="48">Größenordnung M, häufigster Fall</text>
    <rect class="box" x="0" y="66" width="200" height="30" rx="3"/>
    <text x="12" y="86">2 Texte von mir  100 €</text>
    <rect class="box" x="0" y="98" width="200" height="30" rx="3"/>
    <text x="12" y="118">Suchmaschinen-Grundlagen  200 €</text>
    <rect class="box" x="0" y="130" width="200" height="30" rx="3"/>
    <text x="12" y="150">Referenzen  100 €</text>
    <rect class="box" x="0" y="162" width="200" height="30" rx="3"/>
    <text x="12" y="182">Leistungsliste  100 €</text>
    <rect class="box" x="0" y="194" width="200" height="30" rx="3"/>
    <text x="12" y="214">Karte mit Anfahrt  100 €</text>
    <rect class="box" x="0" y="226" width="200" height="30" rx="3"/>
    <text x="12" y="246">Bildergalerie  100 €</text>
    <rect class="box" x="0" y="258" width="200" height="30" rx="3"/>
    <text x="12" y="278">4 Unterseiten  300 €</text>
    <rect class="base" x="0" y="290" width="200" height="50" rx="3"/>
    <text class="w" x="12" y="320" font-weight="600">Grundleistung 500 €</text>
    <text class="m" x="0" y="365">Eigene Seiten für Leistungen,</text>
    <text class="m" x="0" y="382">Referenzen und Anfahrt.</text>
  </g>

  <!-- Säule Groß -->
  <g transform="translate(560 40)">
    <text class="h" font-size="18" y="0">Groß</text>
    <text class="h acc" font-size="22" y="28">1.800 €</text>
    <text class="m" y="48">Größenordnung L</text>
    <rect class="box" x="0" y="66" width="200" height="30" rx="3"/>
    <text x="12" y="86">Bildaufbereitung  125 €</text>
    <rect class="box" x="0" y="98" width="200" height="30" rx="3"/>
    <text x="12" y="118">Team-Sektion  100 €</text>
    <rect class="box" x="0" y="130" width="200" height="30" rx="3"/>
    <text x="12" y="150">2 Texte von mir  100 €</text>
    <rect class="box" x="0" y="162" width="200" height="30" rx="3"/>
    <text x="12" y="182">Suchmaschinen-Grundlagen  200 €</text>
    <rect class="box" x="0" y="194" width="200" height="30" rx="3"/>
    <text x="12" y="214">Referenzen, Leistungsliste  200 €</text>
    <rect class="box" x="0" y="226" width="200" height="30" rx="3"/>
    <text x="12" y="246">Karte, Bildergalerie  200 €</text>
    <rect class="box" x="0" y="258" width="200" height="30" rx="3"/>
    <text x="12" y="278">5 Unterseiten  375 €</text>
    <rect class="base" x="0" y="290" width="200" height="50" rx="3"/>
    <text class="w" x="12" y="320" font-weight="600">Grundleistung 500 €</text>
    <text class="m" x="0" y="365">Wie Mittel, dazu eine Seite mehr,</text>
    <text class="m" x="0" y="382">das Team und aufbereitete Fotos.</text>
  </g>
</svg>
