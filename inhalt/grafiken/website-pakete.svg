  <text x="730" y="40" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">Empfohlen</text>
  <text class="h" x="250" y="44" font-size="20">Klein</text>
  <text class="h acc" x="250" y="76" font-size="22">600 €</text>
  <text class="m" x="250" y="100">eine Seite</text>
  <text class="m" x="250" y="116">mit Abschnitten</text>
  <text class="h" x="430" y="44" font-size="20">Mittel</text>
