    .h { font-family: "Space Grotesk", Inter, system-ui, sans-serif; font-weight: 700; }
    .m { fill: #5C5C5C; }
    .row { fill: #EEEEEB; }
    .acc { fill: #7B1E2B; }
    .ja { fill: #141414; }
    .nein { stroke: #C9C9C5; stroke-width: 2; }
  </style>
