  <text x="20" y="452" font-weight="600">Für 300 € mehr als Mittel arbeitet die Seite mit: Funktion, Team, Bildaufbereitung, eine Seite und zwei Texte mehr.</text>
  <text class="m" x="20" y="472" font-size="12">Die mitarbeitende Funktion, heute die Online-Terminanfrage, läuft nur, solange die Website bei Michael Henning gehostet wird.</text>
  <text class="m" x="20" y="490" font-size="12">Grundausstattung: Impressum, Datenschutz, Kontaktformular, Darstellung auf dem Handy, verschlüsselte Verbindung.</text>
