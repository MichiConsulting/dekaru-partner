<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#141414">
  <title id="t">Die drei Website-Pakete Klein, Mittel und Groß im Vergleich</title>
  <desc id="d">Klein 600 Euro: eine Seite mit Abschnitten, Grundausstattung und Karte mit Anfahrt. Mittel 1.300 Euro: Startseite und 4 Unterseiten, dazu Bildergalerie, Leistungs- oder Speisekarte, Referenzen und Bewertungen, Suchmaschinen-Grundlagen und Texte von mir für 2 Seiten. Groß 1.600 Euro, empfohlen: Startseite und 5 Unterseiten, alles aus Mittel, Texte für 4 Seiten, dazu Team-Seite, Bildaufbereitung bis 20 Bilder und als einziges Paket die mitarbeitende Funktion. Die Funktion läuft nur, solange die Website bei Michael Henning gehostet wird. Grundausstattung heißt Impressum, Datenschutz, Kontaktformular, Darstellung auf dem Handy und verschlüsselte Verbindung.</desc>
