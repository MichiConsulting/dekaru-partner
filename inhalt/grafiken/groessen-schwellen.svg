<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#141414">
  <title id="t">Die drei Größenordnungen S, M und L auf dem Preisstrahl</title>
  <desc id="d">Ein Strahl von 500 Euro aufwärts. Unter 1.000 Euro heißt S, ab 1.000 Euro M, ab 1.700 Euro L. Die Grenzen dienen nur der Einordnung, der Preis entsteht aus den Bausteinen.</desc>
  <style>
    .h { font-family: "Space Grotesk", Inter, system-ui, sans-serif; font-weight: 700; }
    .m { fill: #5C5C5C; }
  </style>
  <!-- Strahl -->
  <rect x="60" y="60" width="240" height="26" fill="#EEEEEB" stroke="#C9C9C5"/>
  <rect x="300" y="60" width="240" height="26" fill="#D9D9D5" stroke="#C9C9C5"/>
  <rect x="540" y="60" width="200" height="26" fill="#141414"/>
  <polygon points="740,52 770,73 740,94" fill="#141414"/>

  <text class="h" x="180" y="78" text-anchor="middle" font-size="14">S</text>
  <text class="h" x="420" y="78" text-anchor="middle" font-size="14">M</text>
  <text class="h" x="640" y="78" text-anchor="middle" font-size="14" fill="#FFFFFF">L</text>

  <!-- Marken -->
  <line x1="60" y1="50" x2="60" y2="96" stroke="#141414" stroke-width="2"/>
  <line x1="300" y1="50" x2="300" y2="96" stroke="#7B1E2B" stroke-width="2"/>
  <line x1="540" y1="50" x2="540" y2="96" stroke="#7B1E2B" stroke-width="2"/>

  <text class="h" x="40" y="40" font-size="14">500 €</text>
  <text class="m" x="20" y="118">Grundpreis, unter den</text>
  <text class="m" x="20" y="134">kein Angebot geht</text>
  <text class="h" x="300" y="40" text-anchor="middle" font-size="14">ab 1.000 €</text>
  <text class="m" x="300" y="118" text-anchor="middle">Grenze S zu M</text>
  <text class="h" x="540" y="40" text-anchor="middle" font-size="14">ab 1.700 €</text>
  <text class="m" x="540" y="118" text-anchor="middle">Grenze M zu L</text>
  <text class="m" x="700" y="118" text-anchor="middle">nach oben offen,</text>
  <text class="m" x="700" y="134" text-anchor="middle">je nach Bausteinen</text>
</svg>
