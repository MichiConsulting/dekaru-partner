<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-labelledby="st-t st-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="st-t">Stufe 1 und Stufe 2 im Zweittermin</title>
  <desc id="st-d">Stufe 1: die ersten fünf Zweittermine gemeinsam, zwei Personen, Michael Henning nennt den Preis. Stufe 2: ab dem sechsten Zweittermin allein, eine Person, Sie nennen den Paketpreis aus dem Preisrechner.</desc>
  <style>
    .f1{fill:var(--lk-f1,#ece6da)}.f2{fill:var(--lk-f2,#e2e7ec)}.ink{fill:var(--lk-ink,#141414)}
    .ln{stroke:var(--lk-ink,#141414);stroke-width:2;fill:none;stroke-linecap:round}.mu{fill:var(--lk-muted,#5f5f5f)}.h{font-weight:700}.s{font-size:11px}
  </style>
  <rect class="f1" x="4" y="4" width="192" height="142" rx="8"/>
  <rect class="f2" x="204" y="4" width="192" height="142" rx="8"/>

  <!-- Stufe 1: zwei Personen -->
  <circle class="ln" cx="34" cy="30" r="7"/><path class="ln" d="M20 56c2-9 8-13 14-13s12 4 14 13"/>
  <circle class="ink" cx="60" cy="30" r="7"/><path class="ink" d="M46 56c2-9 8-13 14-13s12 4 14 13z"/>
  <text class="h" x="92" y="30">Stufe 1</text>
  <text class="s" x="92" y="48">Termine 1 bis 5</text>
  <text class="s" x="20" y="84">Gemeinsam, Video oder vor Ort.</text>
  <text class="s" x="20" y="100">Sie präsentieren die Vorschau,</text>
  <text class="s h" x="20" y="116">er nennt den Preis</text>
  <text class="s mu" x="20" y="134">und beantwortet Technikfragen.</text>

  <!-- Stufe 2: eine Person -->
  <circle class="ln" cx="234" cy="30" r="7"/><path class="ln" d="M220 56c2-9 8-13 14-13s12 4 14 13"/>
  <text class="h" x="266" y="30">Stufe 2</text>
  <text class="s" x="266" y="48">ab dem 6. Zweittermin</text>
  <text class="s" x="220" y="84">Allein. Sie zeigen die Pakete,</text>
  <text class="s h" x="220" y="100">Sie nennen den Paketpreis</text>
  <text class="s" x="220" y="116">und Bausteine, ohne Nachlass.</text>
  <text class="s mu" x="220" y="134">Verträge: Michael Henning.</text>
</svg>
