<svg xmlns="http://www.w3.org/2000/svg" id="g-hj" viewBox="0 0 320 126" role="img" aria-labelledby="hj-t hj-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="hj-t">Jahreszahlung: zehn Monate bezahlt, zwölf erhalten</title>
  <desc id="hj-d">Zwölf Monatsfelder in einer Reihe. Zehn sind gefüllt und bezahlt, zwei sind umrandet und geschenkt. Das ergibt 190 Euro für Start, 390 Euro für Basis und 590 Euro für Plus.</desc>
  <style>
    #g-hj .ink{fill:var(--lk-ink,#141414)}#g-hj .on{fill:var(--lk-paper,#ffffff)}
    #g-hj .frei{fill:none;stroke:var(--lk-ink,#141414);stroke-width:1.5;stroke-dasharray:4 3}#g-hj .mu{fill:var(--lk-muted,#5f5f5f)}#g-hj .h{font-weight:700}#g-hj .t{font-size:13px;font-weight:700}
  </style>
  <g>
    <rect class="ink" x="10" y="28" width="23" height="24" rx="4"/><rect class="ink" x="35" y="28" width="23" height="24" rx="4"/><rect class="ink" x="60" y="28" width="23" height="24" rx="4"/><rect class="ink" x="85" y="28" width="23" height="24" rx="4"/><rect class="ink" x="110" y="28" width="23" height="24" rx="4"/>
    <rect class="ink" x="135" y="28" width="23" height="24" rx="4"/><rect class="ink" x="160" y="28" width="23" height="24" rx="4"/><rect class="ink" x="185" y="28" width="23" height="24" rx="4"/><rect class="ink" x="210" y="28" width="23" height="24" rx="4"/><rect class="ink" x="235" y="28" width="23" height="24" rx="4"/>
    <rect class="frei" x="260" y="28" width="23" height="24" rx="4"/><rect class="frei" x="285" y="28" width="23" height="24" rx="4"/>
  </g>
  <g class="on" text-anchor="middle"><text x="21.5" y="44.3">1</text><text x="46.5" y="44.3">2</text><text x="71.5" y="44.3">3</text><text x="96.5" y="44.3">4</text><text x="121.5" y="44.3">5</text><text x="146.5" y="44.3">6</text><text x="171.5" y="44.3">7</text><text x="196.5" y="44.3">8</text><text x="221.5" y="44.3">9</text><text x="246.5" y="44.3">10</text></g>
  <g text-anchor="middle"><text x="271.5" y="44.3">11</text><text x="296.5" y="44.3">12</text></g>
  <text class="t" x="10" y="18">10 Monate bezahlt</text>
  <text class="t" x="308" y="18" text-anchor="end">2 geschenkt</text>
  <text x="10" y="78">Start <tspan class="h">190 €</tspan></text>
  <text x="92" y="78">Basis <tspan class="h">390 €</tspan></text>
  <text x="178" y="78">Plus <tspan class="h">590 €</tspan> <tspan class="mu">(nur so)</tspan></text>
  <text class="mu" x="10" y="102">Laufzeit zwölf Monate, verlängert sich um zwölf,</text>
  <text class="mu" x="10" y="118">wenn nicht einen Monat vor Ablauf gekündigt wird.</text>
</svg>
