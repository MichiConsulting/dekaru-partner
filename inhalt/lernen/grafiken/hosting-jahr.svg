<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img" aria-labelledby="hj-t hj-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="hj-t">Jahreszahlung: zehn Monate bezahlt, zwölf erhalten</title>
  <desc id="hj-d">Zwölf Monatsfelder in einer Reihe. Zehn sind gefüllt und bezahlt, zwei sind umrandet und geschenkt. Das ergibt 190 Euro für Start, 390 Euro für Basis und 590 Euro für Plus.</desc>
  <style>
    .ink{fill:var(--lk-ink,#141414)}.f2{fill:var(--lk-f2,#e2e7ec)}.on{fill:var(--lk-paper,#ffffff)}
    .frei{fill:none;stroke:var(--lk-ink,#141414);stroke-width:1.5;stroke-dasharray:4 3}.mu{fill:var(--lk-muted,#5f5f5f)}.h{font-weight:700}.s{font-size:11px}
  </style>
  <g>
    <rect class="ink" x="6" y="28" width="28" height="28" rx="4"/><rect class="ink" x="38" y="28" width="28" height="28" rx="4"/><rect class="ink" x="70" y="28" width="28" height="28" rx="4"/><rect class="ink" x="102" y="28" width="28" height="28" rx="4"/><rect class="ink" x="134" y="28" width="28" height="28" rx="4"/>
    <rect class="ink" x="166" y="28" width="28" height="28" rx="4"/><rect class="ink" x="198" y="28" width="28" height="28" rx="4"/><rect class="ink" x="230" y="28" width="28" height="28" rx="4"/><rect class="ink" x="262" y="28" width="28" height="28" rx="4"/><rect class="ink" x="294" y="28" width="28" height="28" rx="4"/>
    <rect class="frei" x="326" y="28" width="28" height="28" rx="4"/><rect class="frei" x="358" y="28" width="28" height="28" rx="4"/>
  </g>
  <g class="s on" text-anchor="middle"><text x="20" y="46">1</text><text x="52" y="46">2</text><text x="84" y="46">3</text><text x="116" y="46">4</text><text x="148" y="46">5</text><text x="180" y="46">6</text><text x="212" y="46">7</text><text x="244" y="46">8</text><text x="276" y="46">9</text><text x="308" y="46">10</text></g>
  <g class="s" text-anchor="middle"><text x="340" y="46">11</text><text x="372" y="46">12</text></g>
  <text class="h" x="6" y="18">10 Monate bezahlt</text>
  <text class="h" x="386" y="18" text-anchor="end">2 geschenkt</text>
  <text class="s" x="6" y="80">Start <tspan class="h">190 €</tspan></text>
  <text class="s" x="110" y="80">Basis <tspan class="h">390 €</tspan></text>
  <text class="s" x="220" y="80">Plus <tspan class="h">590 €</tspan> <tspan class="mu">(nur so)</tspan></text>
  <text class="s mu" x="6" y="104">Laufzeit zwölf Monate, verlängert sich um zwölf, wenn nicht</text>
  <text class="s mu" x="6" y="119">einen Monat vor Ablauf gekündigt wird.</text>
</svg>
