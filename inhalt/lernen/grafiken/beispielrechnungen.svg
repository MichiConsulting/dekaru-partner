<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="br-t br-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="br-t">Drei Beispielrechnungen</title>
  <desc id="br-d">Café mit Paket Klein 600 Euro, Speisekarte 100 Euro, Bildergalerie 100 Euro, Summe 800 Euro. Steuerberatung mit Paket Mittel 1.300 Euro und Team-Seite 100 Euro, Summe 1.400 Euro. Friseursalon mit Paket Groß 1.600 Euro und Logo-Entwurf 250 Euro, Summe 1.850 Euro.</desc>
  <style>
    .p{fill:var(--lk-paper,#ffffff)}.f1{fill:var(--lk-f1,#ece6da)}.f2{fill:var(--lk-f2,#e2e7ec)}.ink{fill:var(--lk-ink,#141414)}
    .ln{stroke:var(--lk-line,#b8b8b8);stroke-width:1;fill:none;stroke-dasharray:3 3}.mu{fill:var(--lk-muted,#5f5f5f)}.h{font-weight:700}.s{font-size:11px}.r{text-anchor:end}
  </style>
  <!-- Bon 1 -->
  <rect class="f2" x="4" y="4" width="124" height="192" rx="6"/>
  <text class="h" x="16" y="26">Café</text><text class="s mu" x="16" y="42">Paket Klein</text>
  <text class="s" x="16" y="70">Klein</text><text class="s r" x="116" y="70">600 €</text>
  <text class="s" x="16" y="90">Speisekarte</text><text class="s r" x="116" y="90">100 €</text>
  <text class="s" x="16" y="110">Bildergalerie</text><text class="s r" x="116" y="110">100 €</text>
  <path class="ln" d="M16 124h100"/>
  <text class="h" x="16" y="146">Summe</text><text class="h r" x="116" y="146">800 €</text>

  <!-- Bon 2 -->
  <rect class="f1" x="138" y="4" width="124" height="192" rx="6"/>
  <text class="h" x="150" y="26">Steuerberatung</text><text class="s mu" x="150" y="42">Paket Mittel</text>
  <text class="s" x="150" y="70">Mittel</text><text class="s r" x="250" y="70">1.300 €</text>
  <text class="s" x="150" y="90">Team-Seite</text><text class="s r" x="250" y="90">100 €</text>
  <path class="ln" d="M150 124h100"/>
  <text class="h" x="150" y="146">Summe</text><text class="h r" x="250" y="146">1.400 €</text>

  <!-- Bon 3 -->
  <rect class="f2" x="272" y="4" width="124" height="192" rx="6"/>
  <text class="h" x="284" y="26">Friseursalon</text><text class="s mu" x="284" y="42">Paket Groß</text>
  <text class="s" x="284" y="70">Groß</text><text class="s r" x="384" y="70">1.600 €</text>
  <text class="s" x="284" y="90">Logo-Entwurf</text><text class="s r" x="384" y="90">250 €</text>
  <path class="ln" d="M284 124h100"/>
  <text class="h" x="284" y="146">Summe</text><text class="h r" x="384" y="146">1.850 €</text>
  <text class="s mu" x="284" y="172">mit Terminanfrage,</text>
  <text class="s mu" x="284" y="186">solange gehostet</text>
</svg>
