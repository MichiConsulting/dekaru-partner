<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-labelledby="va-t va-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="va-t">Die vier Argumente, die überall tragen</title>
  <desc id="va-d">Vier Kacheln: Festpreis vorher, der Betrieb kennt den Preis vor dem Start. Man sieht es vorher, eine gebaute Vorschau mit echten Daten. Ein Termin, der gilt, als Datum im Angebot. Ab dem Auftrag ein Ansprechpartner, dieselbe Person für alles.</desc>
  <style>
    .f1{fill:var(--lk-f1,#ece6da)}.f2{fill:var(--lk-f2,#e2e7ec)}.ink{fill:var(--lk-ink,#141414)}
    .ln{stroke:var(--lk-ink,#141414);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.mu{fill:var(--lk-muted,#5f5f5f)}.h{font-weight:700}.s{font-size:11px}
  </style>
  <rect class="f1" x="4" y="4" width="192" height="98" rx="8"/>
  <rect class="f2" x="204" y="4" width="192" height="98" rx="8"/>
  <rect class="f2" x="4" y="108" width="192" height="98" rx="8"/>
  <rect class="f1" x="204" y="108" width="192" height="98" rx="8"/>

  <!-- Festpreis: Preisschild -->
  <path class="ln" d="M20 20h16l12 12-14 14-14-14z"/><circle class="ink" cx="26" cy="26" r="2.2"/>
  <text class="h" x="58" y="36">Festpreis vorher</text>
  <text class="s mu" x="20" y="66">Der Betrieb weiß vor dem Start,</text>
  <text class="s mu" x="20" y="82">was am Ende auf der Rechnung steht.</text>

  <!-- Vorschau: Bildschirm mit Auge -->
  <rect class="ln" x="220" y="18" width="32" height="22" rx="3"/><path class="ln" d="M230 46h12"/>
  <path class="ln" d="M226 29c3-4 7-6 10-6s7 2 10 6c-3 4-7 6-10 6s-7-2-10-6z"/><circle class="ink" cx="236" cy="29" r="2.2"/>
  <text class="h" x="262" y="36">Man sieht es vorher</text>
  <text class="s mu" x="220" y="66">Eine gebaute Vorschau mit den</text>
  <text class="s mu" x="220" y="82">echten Daten des Betriebs.</text>

  <!-- Termin: Kalender mit Haken -->
  <rect class="ln" x="20" y="124" width="32" height="28" rx="3"/><path class="ln" d="M20 132h32M29 120v8M43 120v8"/>
  <path class="ln" d="M29 141l5 5 8-9"/>
  <text class="h" x="62" y="140">Ein Termin, der gilt</text>
  <text class="s mu" x="20" y="170">Als Datum im Angebot,</text>
  <text class="s mu" x="20" y="186">im Werkvertrag verbindlich.</text>

  <!-- Ansprechpartner: Person -->
  <circle class="ln" cx="236" cy="128" r="7"/><path class="ln" d="M222 152c2-9 8-13 14-13s12 4 14 13"/>
  <text class="h" x="262" y="140">Ein Ansprechpartner</text>
  <text class="s mu" x="220" y="170">Ab dem Auftrag dieselbe Person,</text>
  <text class="s mu" x="220" y="186">von der Rückfrage bis zum Hosting.</text>
</svg>
