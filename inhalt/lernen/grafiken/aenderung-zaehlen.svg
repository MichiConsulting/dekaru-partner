<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-labelledby="az-t az-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="az-t">Gezählt wird nach Anliegen, nicht nach Mails</title>
  <desc id="az-d">Eine Mail mit drei Punkten ergibt drei Änderungen. Darunter die Kontingente: Start 3, Basis 5, Plus 10 im Monat, jede weitere 25 Euro. Gezählt wird erst nach der Umsetzung, eigene Fehler von Michael Henning zählen nie.</desc>
  <style>
    .f1{fill:var(--lk-f1,#ece6da)}.f2{fill:var(--lk-f2,#e2e7ec)}.f3{fill:var(--lk-f3,#cfcfc9)}.ink{fill:var(--lk-ink,#141414)}.p{fill:var(--lk-paper,#ffffff)}.on{fill:var(--lk-paper,#ffffff)}
    .ln{stroke:var(--lk-ink,#141414);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.mu{fill:var(--lk-muted,#5f5f5f)}.h{font-weight:700}.s{font-size:11px}
  </style>
  <!-- Mail -->
  <rect class="p" x="14" y="18" width="110" height="78" rx="5"/>
  <path class="ln" d="M14 23l55 36 55-36"/>
  <rect class="f3" x="28" y="60" width="8" height="8" rx="1"/><rect class="f3" x="42" y="62" width="60" height="4"/>
  <rect class="f3" x="28" y="72" width="8" height="8" rx="1"/><rect class="f3" x="42" y="74" width="48" height="4"/>
  <rect class="f3" x="28" y="84" width="8" height="8" rx="1"/><rect class="f3" x="42" y="86" width="54" height="4"/>
  <text class="s mu" x="69" y="112" text-anchor="middle">eine Mail, drei Punkte</text>

  <!-- Pfeil -->
  <path class="ln" d="M140 57h40m-8-8l8 8-8 8"/>

  <!-- drei Haken -->
  <g><circle class="ink" cx="214" cy="57" r="14"/><path class="ln" d="M207 57l5 5 9-10" style="stroke:var(--lk-paper,#ffffff)"/></g>
  <g><circle class="ink" cx="250" cy="57" r="14"/><path class="ln" d="M243 57l5 5 9-10" style="stroke:var(--lk-paper,#ffffff)"/></g>
  <g><circle class="ink" cx="286" cy="57" r="14"/><path class="ln" d="M279 57l5 5 9-10" style="stroke:var(--lk-paper,#ffffff)"/></g>
  <text class="h" x="312" y="52">= 3</text>
  <text class="s" x="312" y="68">Änderungen</text>
  <text class="s mu" x="250" y="112" text-anchor="middle">gezählt erst nach der Umsetzung</text>

  <!-- Kontingente -->
  <rect class="f2" x="14" y="128" width="372" height="34" rx="6"/>
  <text class="s" x="26" y="149">Im Monat drin: <tspan class="h">Start 3</tspan> · <tspan class="h">Basis 5</tspan> · <tspan class="h">Plus 10</tspan></text>
  <text class="s" x="374" y="149" text-anchor="end">jede weitere <tspan class="h">25 €</tspan></text>
</svg>
