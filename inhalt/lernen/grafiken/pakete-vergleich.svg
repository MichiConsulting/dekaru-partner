<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-labelledby="pv-t pv-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="pv-t">Die drei Pakete Klein, Mittel und Groß</title>
  <desc id="pv-d">Drei Spalten. Klein für 600 Euro: eine Seite mit Abschnitten, Grundausstattung und Anfahrt. Mittel für 1.300 Euro: Startseite und vier Unterseiten, dazu Galerie, Leistungskarte, Referenzen, Suchmaschinen-Grundlagen und Texte für zwei Seiten. Groß für 1.600 Euro, empfohlen: Startseite und fünf Unterseiten, alles aus Mittel, Texte für vier Seiten, Team-Seite, Bildaufbereitung und als einziges Paket die mitarbeitende Funktion.</desc>
  <style>
    .f1{fill:var(--lk-f1,#ece6da)}.f2{fill:var(--lk-f2,#e2e7ec)}.f3{fill:var(--lk-f3,#cfcfc9)}.ink{fill:var(--lk-ink,#141414)}.p{fill:var(--lk-paper,#ffffff)}
    .ln{stroke:var(--lk-ink,#141414);stroke-width:1.5;fill:none}.mu{fill:var(--lk-muted,#5f5f5f)}.on{fill:var(--lk-paper,#ffffff)}.h{font-weight:700}.s{font-size:11px}.xl{font-size:20px;font-weight:700}
  </style>
  <!-- Klein -->
  <rect class="f2" x="4" y="24" width="122" height="208" rx="8"/>
  <text class="h" x="65" y="46" text-anchor="middle">Klein</text>
  <text class="xl" x="65" y="72" text-anchor="middle">600 €</text>
  <rect class="p" x="48" y="84" width="34" height="44" rx="2"/><rect class="f3" x="52" y="90" width="26" height="6"/><rect class="f3" x="52" y="100" width="26" height="4"/><rect class="f3" x="52" y="108" width="26" height="4"/><rect class="f3" x="52" y="116" width="18" height="4"/>
  <text class="s mu" x="65" y="146" text-anchor="middle">eine Seite</text>
  <text class="s" x="65" y="170" text-anchor="middle">Grundausstattung</text>
  <text class="s" x="65" y="186" text-anchor="middle">Karte mit Anfahrt</text>
  <text class="s mu" x="65" y="214" text-anchor="middle">Visitenkarte im Netz</text>

  <!-- Mittel -->
  <rect class="f1" x="139" y="24" width="122" height="208" rx="8"/>
  <text class="h" x="200" y="46" text-anchor="middle">Mittel</text>
  <text class="xl" x="200" y="72" text-anchor="middle">1.300 €</text>
  <rect class="p" x="165" y="84" width="26" height="34" rx="2"/><rect class="f3" x="169" y="90" width="18" height="5"/><rect class="f3" x="169" y="99" width="18" height="3"/><rect class="f3" x="169" y="106" width="12" height="3"/>
  <g class="p"><rect x="197" y="92" width="10" height="13" rx="1"/><rect x="210" y="92" width="10" height="13" rx="1"/><rect x="197" y="109" width="10" height="13" rx="1"/><rect x="210" y="109" width="10" height="13" rx="1"/></g>
  <text class="s mu" x="200" y="146" text-anchor="middle">Start + 4 Unterseiten</text>
  <text class="s" x="200" y="170" text-anchor="middle">Galerie, Leistungen,</text>
  <text class="s" x="200" y="186" text-anchor="middle">Referenzen, Google</text>
  <text class="s mu" x="200" y="214" text-anchor="middle">Texte für 2 Seiten</text>

  <!-- Gross -->
  <rect class="ink" x="274" y="24" width="122" height="208" rx="8"/>
  <rect class="f1" x="301" y="2" width="68" height="18" rx="9"/><text class="s h" x="335" y="15" text-anchor="middle">Empfohlen</text>
  <text class="h on" x="335" y="46" text-anchor="middle">Groß</text>
  <text class="xl on" x="335" y="72" text-anchor="middle">1.600 €</text>
  <rect class="p" x="298" y="84" width="26" height="34" rx="2"/><rect class="f3" x="302" y="90" width="18" height="5"/><rect class="f3" x="302" y="99" width="18" height="3"/><rect class="f3" x="302" y="106" width="12" height="3"/>
  <g class="p"><rect x="330" y="88" width="10" height="13" rx="1"/><rect x="343" y="88" width="10" height="13" rx="1"/><rect x="356" y="88" width="10" height="13" rx="1"/><rect x="330" y="105" width="10" height="13" rx="1"/><rect x="343" y="105" width="10" height="13" rx="1"/></g>
  <text class="s on" x="335" y="146" text-anchor="middle" opacity="0.8">Start + 5 Unterseiten</text>
  <text class="s on" x="335" y="170" text-anchor="middle">Alles aus Mittel,</text>
  <text class="s on" x="335" y="186" text-anchor="middle">Team, Bilder, 4 Texte</text>
  <text class="s h on" x="335" y="208" text-anchor="middle">+ mitarbeitende</text>
  <text class="s h on" x="335" y="222" text-anchor="middle">Funktion</text>
</svg>
