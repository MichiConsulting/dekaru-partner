<svg xmlns="http://www.w3.org/2000/svg" id="g-pv" viewBox="0 0 320 294" role="img" aria-labelledby="pv-t pv-d" fill="currentColor" font-family="Inter, system-ui, sans-serif" font-size="12">
  <title id="pv-t">Die drei Pakete Klein, Mittel und Groß</title>
  <desc id="pv-d">Drei Zeilen untereinander. Klein für 600 Euro: eine Seite mit Abschnitten, Grundausstattung und Anfahrt. Mittel für 1.300 Euro: Startseite und vier Unterseiten, dazu Galerie, Leistungskarte, Referenzen, Suchmaschinen-Grundlagen und Texte für zwei Seiten. Groß für 1.600 Euro, empfohlen: Startseite und fünf Unterseiten, alles aus Mittel, Texte für vier Seiten, Team-Seite, Bildaufbereitung und als einziges Paket die mitarbeitende Funktion.</desc>
  <style>
    #g-pv .f1{fill:var(--lk-f1,#ece6da)}#g-pv .f2{fill:var(--lk-f2,#e2e7ec)}#g-pv .f3{fill:var(--lk-f3,#cfcfc9)}#g-pv .ink{fill:var(--lk-ink,#141414)}#g-pv .p{fill:var(--lk-paper,#ffffff)}
    #g-pv .mu{fill:var(--lk-muted,#5f5f5f)}#g-pv .on{fill:var(--lk-paper,#ffffff)}#g-pv .h{font-weight:700}#g-pv .t{font-size:13px;font-weight:700}#g-pv .xl{font-size:18px;font-weight:700}
  </style>
  <!-- Klein -->
  <rect class="f2" x="4" y="4" width="312" height="80" rx="8"/>
  <text class="t" x="16" y="28">Klein</text>
  <text class="xl" x="16" y="54">600 €</text>
  <rect class="p" x="100" y="16" width="34" height="44" rx="2"/><rect class="f3" x="104" y="22" width="26" height="6"/><rect class="f3" x="104" y="32" width="26" height="4"/><rect class="f3" x="104" y="40" width="26" height="4"/><rect class="f3" x="104" y="48" width="18" height="4"/>
  <text class="mu" x="16" y="74">Visitenkarte im Netz</text>
  <text class="mu" x="150" y="28">eine Seite</text>
  <text x="150" y="46">Grundausstattung</text>
  <text x="150" y="62">Karte mit Anfahrt</text>

  <!-- Mittel -->
  <rect class="f1" x="4" y="92" width="312" height="80" rx="8"/>
  <text class="t" x="16" y="116">Mittel</text>
  <text class="xl" x="16" y="142">1.300 €</text>
  <rect class="p" x="96" y="104" width="26" height="34" rx="2"/><rect class="f3" x="100" y="110" width="18" height="5"/><rect class="f3" x="100" y="119" width="18" height="3"/><rect class="f3" x="100" y="126" width="12" height="3"/>
  <g class="p"><rect x="126" y="112" width="10" height="13" rx="1"/><rect x="139" y="112" width="10" height="13" rx="1"/><rect x="126" y="129" width="10" height="13" rx="1"/><rect x="139" y="129" width="10" height="13" rx="1"/></g>
  <text class="mu" x="16" y="162">Texte für 2 Seiten</text>
  <text class="mu" x="160" y="114">Start + 4 Unterseiten</text>
  <text x="160" y="132">Galerie, Leistungen,</text>
  <text x="160" y="148">Referenzen, Google</text>

  <!-- Gross -->
  <rect class="ink" x="4" y="190" width="312" height="100" rx="8"/>
  <rect class="f1" x="232" y="179" width="78" height="22" rx="11"/><text class="h" x="271" y="194.3" text-anchor="middle">Empfohlen</text>
  <text class="t on" x="16" y="214">Groß</text>
  <text class="xl on" x="16" y="240">1.600 €</text>
  <rect class="p" x="96" y="204" width="26" height="34" rx="2"/><rect class="f3" x="100" y="210" width="18" height="5"/><rect class="f3" x="100" y="219" width="18" height="3"/><rect class="f3" x="100" y="226" width="12" height="3"/>
  <g class="p"><rect x="126" y="208" width="10" height="13" rx="1"/><rect x="139" y="208" width="10" height="13" rx="1"/><rect x="126" y="225" width="10" height="13" rx="1"/><rect x="139" y="225" width="10" height="13" rx="1"/><rect x="126" y="242" width="10" height="13" rx="1"/></g>
  <text class="on" x="16" y="262" opacity="0.8">Texte für 4 Seiten</text>
  <text class="on" x="160" y="214" opacity="0.8">Start + 5 Unterseiten</text>
  <text class="on" x="160" y="232">Alles aus Mittel,</text>
  <text class="on" x="160" y="248">Team-Seite, Bilder</text>
  <text class="h on" x="160" y="266">+ mitarbeitende</text>
  <text class="h on" x="160" y="282">Funktion</text>
</svg>
